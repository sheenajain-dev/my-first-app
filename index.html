<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Task Checklist</h1>
      <p class="subtitle">Stay organized, one task at a time</p>
    </header>

    <form class="add-form" id="addForm" autocomplete="off">
      <input
        type="text"
        id="taskInput"
        class="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
        aria-label="New task"
      >
      <button type="submit" class="btn btn-primary" aria-label="Add task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add
      </button>
    </form>

    <div class="stats" id="stats" hidden>
      <span id="taskCount">0 tasks</span>
      <button type="button" class="btn btn-ghost" id="clearCompleted">Clear completed</button>
    </div>

    <ul class="task-list" id="taskList" aria-label="Task list"></ul>

    <p class="empty-state" id="emptyState">
      No tasks yet. Add one above to get started.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
